<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f8f4e">
  <title>Tickweek</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tickweek">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="/"><img src="/icons/favicon.svg" alt="" width="28" height="28"><span class="wm">Tick<span>week</span></span></a>
    <a class="iconbtn" href="/help" aria-label="How it works" title="How it works" style="font-weight:700;font-size:18px">?</a>
    <a class="iconbtn" href="/history" aria-label="History" title="History">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 6-6"/></svg>
    </a>
    <a class="iconbtn" href="/settings" aria-label="Settings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>

  <nav class="weeknav">
    <button class="iconbtn" id="prev" aria-label="Previous week">‹</button>
    <div class="label" id="weeklabel">…</div>
    <button class="iconbtn" id="next" aria-label="Next week">›</button>
  </nav>

  <div id="notices"></div>
  <section class="card" id="gridcard"></section>
  <section class="card" id="scorecard"></section>
  <section class="card" id="weigh"></section>
  <section class="card hidden" id="streakcard"></section>
</main>

<dialog class="pad" id="pad">
  <div class="head"><div class="t" id="padtitle"></div><div class="muted small" id="padsub"></div></div>
  <div class="display" id="paddisplay"></div>
  <div class="keys" id="padkeys"></div>
  <div class="actions">
    <button class="btn" id="padcancel">Cancel</button>
    <button class="btn danger" id="padclear">Clear</button>
    <button class="btn primary" id="padsave">Save</button>
  </div>
</dialog>

<script type="module" src="/js/week.js"></script>
</body>
</html>
