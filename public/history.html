<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f8f4e">
  <title>Tickweek history</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tickweek">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="/"><img src="/icons/favicon.svg" alt="" width="28" height="28"><span class="wm">Tick<span>week</span></span></a>
    <a class="iconbtn" href="/" aria-label="Back to this week" title="This week">✕</a>
  </header>

  <section class="card">
    <h2>Weight</h2>
    <div id="chart" class="chart"></div>
  </section>

  <section class="card">
    <h2>Records</h2>
    <div class="tiles" id="records"></div>
  </section>

  <section class="card">
    <h2>Targets</h2>
    <ul class="tlist" id="targetstats"></ul>
  </section>

  <section class="card" id="weekscard">
    <h2>Weeks</h2>
    <div class="small muted" id="legend" style="margin:-4px 0 8px"></div>
    <div id="weeks"></div>
  </section>
</main>
<script type="module" src="/js/history.js"></script>
</body>
</html>
